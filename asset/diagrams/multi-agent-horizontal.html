<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;background:#fff}
  svg{display:block;font-family:Roboto,Helvetica,Arial,sans-serif}
  .box{fill:#fff;stroke:#161616;stroke-width:2}
  .pill{fill:#fff;stroke:#161616;stroke-width:2}
  .human{fill:#f5e6c4;stroke:#b8975a;stroke-width:2}
  .t{font-size:17px;fill:#161616;text-anchor:middle;dominant-baseline:central}
  .tb{font-weight:700}
  .e{fill:none;stroke:#161616;stroke-width:2;marker-end:url(#a)}
  .d{stroke-dasharray:4 5}
  .lbl{font-size:14px;fill:#161616;text-anchor:middle;dominant-baseline:central}
  .lblbg{fill:#e0e0e0}
  .lane{font-size:13px;font-weight:700;letter-spacing:.12em;fill:#6f6f6f}
  .coord{fill:#f4f4f4;stroke:#8d8d8d;stroke-width:1.5;stroke-dasharray:6 5}
  .ct{font-size:16px;fill:#161616}
</style></head><body>
<svg id="s" width="1540" height="780" viewBox="0 0 1540 780" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#161616"/>
  </marker>
</defs>

<text class="lane" x="30" y="38">PLAN</text>
<text class="lane" x="1477" y="286" text-anchor="end">BUILD &amp; VERIFY: ONE MODULE AT A TIME</text>

<!-- ROW 1 (y 70-150, center 110) -->
<rect class="pill" x="30" y="78" width="205" height="64" rx="32"/>
<text class="t" x="132" y="110">User requirements</text>

<rect class="box" x="277" y="70" width="205" height="80"/>
<text class="t" x="380" y="88"><tspan class="tb">PM</tspan></text>
<text class="t" x="380" y="112">write PRD: proposal →</text>
<text class="t" x="380" y="133">approval → apply</text>

<rect class="box" x="524" y="70" width="205" height="80"/>
<text class="t" x="627" y="88"><tspan class="tb">Tech Lead</tspan></text>
<text class="t" x="627" y="112">feasibility review,</text>
<text class="t" x="627" y="133">setup runbook</text>

<polygon class="human" points="790,70 931,70 958,110 931,150 790,150 763,110"/>
<text class="t" x="860" y="98"><tspan class="tb">Human</tspan></text>
<text class="t" x="860" y="122">set up &amp; approve</text>

<rect class="box" x="1000" y="70" width="205" height="80"/>
<text class="t" x="1102" y="98"><tspan class="tb">PM</tspan></text>
<text class="t" x="1102" y="122">finalize PRD [INIT]</text>

<rect class="box" x="1247" y="62" width="230" height="96"/>
<text class="t" x="1362" y="82"><tspan class="tb">Doc-Sync</tspan></text>
<text class="t" x="1362" y="106">PRD → module specs,</text>
<text class="t" x="1362" y="127">generates Engineer + QA</text>
<text class="t" x="1362" y="146">agents per module</text>

<path class="e" d="M235,110 H275"/>
<path class="e" d="M482,110 H522"/>
<path class="e" d="M729,110 H761"/>
<path class="e" d="M958,110 H998"/>
<path class="e" d="M1205,110 H1245"/>

<!-- Doc-Sync -> Engineer channel -->
<path class="e" d="M1362,158 V205 H100 V298"/>
<rect class="lblbg" x="700" y="194" width="96" height="22"/><text class="lbl" x="748" y="205">specs ready</text>

<!-- ROW 2 (y 300-380, center 340) -->
<rect class="box" x="30" y="300" width="205" height="80"/>
<text class="t" x="132" y="328"><tspan class="tb">Engineer</tspan></text>
<text class="t" x="132" y="352">implement one module</text>

<rect class="box" x="330" y="300" width="205" height="80"/>
<text class="t" x="432" y="318"><tspan class="tb">QA</tspan></text>
<text class="t" x="432" y="342">verify against spec</text>
<text class="t" x="432" y="363">in the running app</text>

<rect class="box" x="640" y="300" width="215" height="80"/>
<text class="t" x="747" y="318"><tspan class="tb">Tech Lead</tspan></text>
<text class="t" x="747" y="342">phase integration review</text>
<text class="t" x="747" y="363">(human decides fixes)</text>

<rect class="box" x="955" y="300" width="205" height="80"/>
<text class="t" x="1057" y="318"><tspan class="tb">PM checkpoint</tspan></text>
<text class="t" x="1057" y="342">review the phase</text>
<text class="t" x="1057" y="363">with the human</text>

<rect class="pill" x="1272" y="308" width="205" height="64" rx="32"/>
<text class="t" x="1374" y="340">Project complete</text>

<!-- Engineer <-> QA -->
<path class="e" d="M235,325 H328"/>
<path class="e" d="M330,358 H237"/>
<rect class="lblbg" x="242" y="361" width="82" height="22"/><text class="lbl" x="283" y="372">bug found</text>

<!-- QA -> integration -->
<path class="e" d="M535,340 H638"/>
<rect class="lblbg" x="543" y="306" width="88" height="22"/><text class="lbl" x="587" y="317">phase pass</text>
<!-- integration -> checkpoint -->
<path class="e" d="M855,340 H953"/>
<rect class="lblbg" x="866" y="306" width="76" height="22"/><text class="lbl" x="904" y="317">all clear</text>
<!-- checkpoint -> complete -->
<path class="e" d="M1160,340 H1270"/>
<rect class="lblbg" x="1170" y="306" width="90" height="22"/><text class="lbl" x="1215" y="317">final phase</text>
<!-- checkpoint -> next phase -> Engineer -->
<path class="e" d="M1057,300 V245 H170 V298"/>
<rect class="lblbg" x="560" y="234" width="94" height="22"/><text class="lbl" x="607" y="245">next phase</text>

<!-- ROW 3 (y 470-550, center 510) -->
<rect class="box" x="30" y="470" width="205" height="80"/>
<text class="t" x="132" y="488"><tspan class="tb">Tech Lead</tspan></text>
<text class="t" x="132" y="512">repeat-failure</text>
<text class="t" x="132" y="533">diagnosis</text>

<polygon class="human" points="357,470 508,470 535,510 508,550 357,550 330,510"/>
<text class="t" x="432" y="498"><tspan class="tb">Human</tspan></text>
<text class="t" x="432" y="522">UI sign-off</text>

<rect class="box" x="640" y="470" width="215" height="80"/>
<text class="t" x="747" y="488"><tspan class="tb">PM change flow</tspan></text>
<text class="t" x="747" y="512">proposal → human</text>
<text class="t" x="747" y="533">approval → update PRD</text>

<rect class="box" x="955" y="470" width="205" height="80"/>
<text class="t" x="1057" y="488"><tspan class="tb">Retrospective</tspan></text>
<text class="t" x="1057" y="512">propose system</text>
<text class="t" x="1057" y="533">improvements</text>

<polygon class="human" points="1299,470 1450,470 1477,510 1450,550 1299,550 1272,510"/>
<text class="t" x="1374" y="498"><tspan class="tb">Human</tspan></text>
<text class="t" x="1374" y="522">review &amp; apply</text>

<!-- QA -> repeat failure -> Engineer -->
<path class="e" d="M370,380 L222,468"/>
<rect class="lblbg" x="254" y="415" width="88" height="22"/><text class="lbl" x="298" y="426">3rd failure</text>
<path class="e" d="M100,470 V382"/>
<rect class="lblbg" x="57" y="415" width="78" height="22"/><text class="lbl" x="96" y="426">diagnosis</text>

<!-- QA <-> human sign-off -->
<path class="e" d="M445,380 V468"/>
<path class="e" d="M420,470 V382"/>

<!-- QA -> PM change -->
<path class="e" d="M510,380 L660,468"/>
<rect class="lblbg" x="548" y="415" width="88" height="22"/><text class="lbl" x="592" y="426">spec issue</text>
<!-- PM change -> Doc-Sync (right-side channel) -->
<path class="e d" d="M747,550 V590 H1510 V110 H1479"/>
<rect class="lblbg" x="1180" y="579" width="96" height="22"/><text class="lbl" x="1228" y="590">re-sync specs</text>

<!-- checkpoint -> retrospective -> human -->
<path class="e d" d="M1057,380 V468"/>
<rect class="lblbg" x="1062" y="415" width="70" height="22"/><text class="lbl" x="1097" y="426">optional</text>
<path class="e d" d="M1160,510 H1270"/>
<rect class="lblbg" x="1176" y="478" width="78" height="22"/><text class="lbl" x="1215" y="489">proposals</text>

<!-- Coordinator band -->
<rect class="coord" x="30" y="630" width="1480" height="118" rx="8"/>
<text class="ct" x="54" y="664"><tspan font-weight="700">Coordinator:</tspan> the main Claude Code session runs each agent as a subagent, follows its <tspan font-family="monospace">next:</tspan> line, and relays questions word for word.</text>
<text class="ct" x="54" y="692">It runs the pstack reviews (how · thermos · blast-radius) and saves the findings for Tech Lead. It never edits an owned file.</text>
<text class="ct" x="54" y="720">Every handoff is an atomic git commit plus a Last Action record, so the flow resumes after /clear and any step can be rolled back.</text>
</svg>
</body></html>
